# Development toolchain. Picked up automatically by mise (locally and in the
# Linear agent sandbox). Keep the Hugo and Node versions in sync with
# .github/workflows/deploy.yml and test.yml.
[tools]
hugo = "0.170.1"
node = "26"
# Cloudflare Pages CLI, for running `functions/` locally (`wrangler pages dev`).
"npm:wrangler" = "4"
